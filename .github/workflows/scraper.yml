name: News Scraper & Summarizer

on:
  schedule:
    - cron: '*/30 * * * *' # 每 30 分鐘執行一次
  workflow_dispatch:       # 支援在網頁上手動點擊測試

permissions:
  contents: write          # 允許 Action 將更新後的資料庫與 JSON 寫回倉庫

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache HuggingFace Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-minilm-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper and Summarizer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py

      - name: Commit and Push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.db widget_data.json
          git diff --staged --quiet || (git commit -m "chore: update news data" && git pull --rebase origin main && git push)
